# CampusConnect frontend — nginx config template
# Serves the built SPA and reverse-proxies API + WebSocket traffic to the
# backend. Set BACKEND_URL to the backend origin (without a trailing slash).

# Map for WebSocket connection upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip text assets for faster loads.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml text/xml image/svg+xml font/woff2;

    # Sensible security headers (no secrets involved).
    add_header X-Content-Type-Options nosniff        always;
    add_header X-Frame-Options        SAMEORIGIN     always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # ---- REST API -> backend (path /api is preserved and expected by controllers) ----
    location /api/ {
        proxy_pass         ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- SockJS / STOMP WebSocket -> backend ----
    location /ws {
        proxy_pass         ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_ssl_server_name on;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep long-lived sockets open
    }

    # Cache hashed static assets aggressively; Vite fingerprints filenames.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ---- SPA fallback: every other route resolves to index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
