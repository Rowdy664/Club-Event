# CampusConnect ΓÇö full stack (MySQL + Spring Boot API + nginx/React SPA)
#
# Quick start:
#   1) cp .env.example .env      # then edit secrets in .env
#   2) docker compose up --build
#   3) open http://localhost:${FRONTEND_PORT:-8081}
#
# Secrets (DB password, JWT secret) are read from .env ΓÇö never hardcoded here.
# The ":?" guards fail fast with a helpful message if .env is missing.

name: campusconnect

services:
  # ----------------------------- Database -----------------------------
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusconnect}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tharun1437}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-tharun1437}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - campusconnect

  # --------------------------- Backend API ----------------------------
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      # Point the app at the mysql service on the compose network.
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-campusconnect}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tharun1437}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      # Security-critical ΓÇö provided via .env, never hardcoded. Fails fast if unset.
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env (generate with openssl rand -base64 48)}"
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      # Browser origin(s) allowed to call the API directly.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173,http://localhost:3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8081}
      # Demo data incl. a demo admin with a known password. Fine for the local demo
      # stack; set SEED_ENABLED=false for any real deployment.
      SEED_ENABLED: ${SEED_ENABLED:-true}
      # Mail is optional; when disabled the app logs notifications instead of sending.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@campusconnect.local}
      # Payment gateway abstraction ΓÇö credentials (if any) come from env, never code.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-razorpay}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-INR}
      # Real card/UPI payments via Razorpay activate ONLY when PAYMENT_PROVIDER=razorpay
      # AND these keys are set (test mode uses rzp_test_* keys). Until then the default
      # 'mock' gateway settles instantly (handy for local demos). The secret key stays
      # server-side and is never exposed to the browser.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_BASE_URL: ${RAZORPAY_BASE_URL:-https://api.razorpay.com/v1}
      # WhatsApp ticket delivery. Default 'log' only logs the message; set
      # WHATSAPP_PROVIDER=twilio with the Twilio credentials below to send real
      # WhatsApp messages. TWILIO_WHATSAPP_FROM is the sandbox/sender number, e.g.
      # whatsapp:+14155238886. WHATSAPP_DEFAULT_COUNTRY_CODE (e.g. 91) is applied to
      # phone numbers stored without a leading '+'.
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-log}
      WHATSAPP_DEFAULT_COUNTRY_CODE: ${WHATSAPP_DEFAULT_COUNTRY_CODE:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_BASE_URL: ${TWILIO_BASE_URL:-https://api.twilio.com}
      # AI is interface-only until a key is supplied.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports:
      # Exposed so you can reach Swagger UI directly at http://localhost:8080/swagger-ui.html
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - campusconnect

  # ------------------------- Frontend (SPA) ---------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin defaults; nginx proxies these to the backend service.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
    environment:
      API_UPSTREAM_ORIGIN: ${API_UPSTREAM_ORIGIN:-http://backend:8080}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - campusconnect

volumes:
  mysql-data:
    driver: local

networks:
  campusconnect:
    driver: bridge
